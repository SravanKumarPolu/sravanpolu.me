    <!-- ✅ Self-hosted variable fonts (Inter + JetBrains Mono, latin subsets,
         identical files to the Google Fonts CDN release).
         Why not the Google CSS link: it shipped as media="print" (non-blocking),
         which pushed @font-face discovery + the font file behind a
         lowest-priority request that lands AFTER the main bundle on slow
         links — costing ~0.9 s of simulated mobile LCP. Self-hosting puts the
         LCP-critical font on a same-origin preload (no CORS/CDN round trip),
         keeps font-display: swap semantics, and removes two third-party
         connections. File names carry the upstream version (v20/v24) so the
         immutable cache header can never serve a stale file after an update.
         OFL-licensed — redistribution is permitted. -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/inter-v20-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/inter-v20-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/jetbrains-mono-v24-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
